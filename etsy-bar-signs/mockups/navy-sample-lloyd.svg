<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1400" role="img" aria-label="Lloyd navy panel">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Limelight&amp;family=Cinzel:wght@400;600;700&amp;family=Caveat:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,700;1,700&amp;display=swap');
      .title   { font-family: 'Limelight', 'Cinzel', serif; letter-spacing: 6px; }
      .quote   { font-family: 'Caveat', cursive; font-weight: 700; }
      .soft    { font-family: 'Caveat', cursive; font-weight: 400; }
      .attrib  { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 10px; }
    </style>
  </defs>

  <rect width="1100" height="1400" fill="#1A2238"/>

  <!-- art deco border -->
  <path d="M 110 90 L 840 90 L 870 110 L 900 90 L 990 90"
        fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 1010 110 L 1010 840 L 990 870 L 1010 900 L 1010 1290"
        fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 990 1310 L 260 1310 L 230 1290 L 200 1310 L 110 1310"
        fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 90 1290 L 90 560 L 110 530 L 90 500 L 90 110"
        fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <g stroke="#F2E4C4" stroke-width="1.5" fill="none">
    <path d="M 110 90 L 110 60 L 70 60 L 70 110 L 90 110"/>
    <path d="M 990 90 L 990 60 L 1030 60 L 1030 110 L 1010 110"/>
    <path d="M 1010 1290 L 1030 1290 L 1030 1340 L 990 1340 L 990 1310"/>
    <path d="M 90 1290 L 70 1290 L 70 1340 L 110 1340 L 110 1310"/>
  </g>
  <rect x="115" y="115" width="870" height="1170" fill="none" stroke="#F2E4C4" stroke-width="0.8"/>

  <!-- title -->
  <text x="550" y="290" text-anchor="middle" class="title" font-size="54" fill="#F2E4C4">ORDERS FROM THE HOUSE</text>
  <line x1="300" y1="340" x2="800" y2="340" stroke="#F2E4C4" stroke-width="0.8"/>

  <!-- quote -->
  <text x="550" y="580" text-anchor="middle" class="quote" font-size="84" fill="#F2E4C4">"Your money's</text>
  <text x="550" y="680" text-anchor="middle" class="quote" font-size="84" fill="#F2E4C4">no good here, sir.</text>

  <text x="550" y="870" text-anchor="middle" class="soft" font-size="72" fill="#F2E4C4">Orders from the house."</text>

  <!-- attribution -->
  <line x1="380" y1="1100" x2="720" y2="1100" stroke="#F2E4C4" stroke-width="0.8"/>
  <text x="550" y="1170" text-anchor="middle" class="attrib" font-size="22" fill="#F2E4C4">LLOYD</text>
  <text x="550" y="1215" text-anchor="middle" class="attrib" font-size="14" fill="#F2E4C4">THE OVERLOOK HOTEL · BARTENDER</text>
</svg>
