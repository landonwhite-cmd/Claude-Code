<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1400" role="img" aria-label="Casablanca gin joints bar sign">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&amp;family=IM+Fell+English:ital@0;1&amp;family=Cinzel:wght@400;600;700&amp;display=swap');
      .lead   { font-family: 'Cinzel', serif; letter-spacing: 8px; }
      .quote  { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; }
      .soft   { font-family: 'IM Fell English', serif; font-style: italic; }
      .attrib { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 12px; }
      .small  { font-family: 'Cinzel', serif; letter-spacing: 6px; }
    </style>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2B1C12"/>
      <stop offset="50%"  stop-color="#3A2A1D"/>
      <stop offset="100%" stop-color="#2E1F14"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0 0.04  0 0 0 0.22 0"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="1400" fill="url(#wood)"/>
  <rect width="1100" height="1400" fill="#3B2B1F" filter="url(#grain)" opacity="0.55"/>
  <g stroke="#1A1008" stroke-width="1" opacity="0.3">
    <line x1="0" y1="200"  x2="1100" y2="195"/>
    <line x1="0" y1="460"  x2="1100" y2="466"/>
    <line x1="0" y1="720"  x2="1100" y2="713"/>
    <line x1="0" y1="980"  x2="1100" y2="986"/>
    <line x1="0" y1="1220" x2="1100" y2="1214"/>
  </g>
  <rect width="1100" height="1400" fill="url(#vig)"/>

  <!-- art deco border -->
  <rect x="50" y="50" width="1000" height="1300" fill="none" stroke="#B48B3C" stroke-width="2.5"/>
  <rect x="66" y="66" width="968" height="1268" fill="none" stroke="#B48B3C" stroke-width="1"/>
  <!-- corner fans -->
  <g fill="none" stroke="#B48B3C" stroke-width="1.2">
    <path d="M 50 110 L 110 50 M 50 140 L 140 50 M 50 170 L 170 50"/>
    <path d="M 1050 110 L 990 50 M 1050 140 L 960 50 M 1050 170 L 930 50"/>
    <path d="M 50 1290 L 110 1350 M 50 1260 L 140 1350 M 50 1230 L 170 1350"/>
    <path d="M 1050 1290 L 990 1350 M 1050 1260 L 960 1350 M 1050 1230 L 930 1350"/>
  </g>

  <!-- top sunburst / martini fan ornament -->
  <g transform="translate(550,180)" fill="none" stroke="#B48B3C" stroke-width="1.5">
    <line x1="0" y1="-30" x2="0" y2="-5"/>
    <line x1="-20" y1="-22" x2="-4" y2="-4"/>
    <line x1="20" y1="-22" x2="4" y2="-4"/>
    <line x1="-28" y1="-10" x2="-5" y2="-2"/>
    <line x1="28" y1="-10" x2="5" y2="-2"/>
    <circle r="3" fill="#B48B3C"/>
    <line x1="-60" y1="0" x2="-35" y2="0" stroke-width="1"/>
    <line x1="60" y1="0" x2="35" y2="0" stroke-width="1"/>
  </g>

  <!-- quote lines -->
  <text x="550" y="440" text-anchor="middle" class="quote" font-size="72" fill="#F2E4C4">Of all the gin joints</text>
  <text x="550" y="530" text-anchor="middle" class="quote" font-size="72" fill="#F2E4C4">in all the towns</text>
  <text x="550" y="620" text-anchor="middle" class="quote" font-size="72" fill="#F2E4C4">in all the world,</text>

  <!-- divider -->
  <g stroke="#B48B3C" stroke-width="1.2">
    <line x1="280" y1="720" x2="500" y2="720"/>
    <line x1="600" y1="720" x2="820" y2="720"/>
  </g>
  <polygon points="550,708 560,720 550,732 540,720" fill="#B48B3C"/>

  <text x="550" y="840" text-anchor="middle" class="soft" font-size="60" fill="#E8D9B8">she walks into mine.</text>

  <!-- lower flourish -->
  <g transform="translate(550,1010)" stroke="#B48B3C" stroke-width="1.5" fill="none">
    <path d="M -140 0 Q -70 -18 0 0 Q 70 18 140 0"/>
    <circle cx="0" cy="0" r="3" fill="#B48B3C" stroke="none"/>
    <circle cx="-140" cy="0" r="2" fill="#B48B3C" stroke="none"/>
    <circle cx="140" cy="0" r="2" fill="#B48B3C" stroke="none"/>
  </g>

  <text x="550" y="1200" text-anchor="middle" class="attrib" font-size="28" fill="#C9A961">RICK BLAINE</text>
  <text x="550" y="1250" text-anchor="middle" class="small" font-size="18" fill="#C9A961">CAFÉ AMÉRICAIN · CASABLANCA</text>
</svg>
