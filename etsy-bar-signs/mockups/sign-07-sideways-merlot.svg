<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1400" role="img" aria-label="Sideways Merlot navy panel">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Limelight&amp;family=Cinzel:wght@400;600;700&amp;family=Caveat:wght@400;500;600;700&amp;display=swap');
      .quote  { font-family: 'Caveat', cursive; font-weight: 600; }
      .bang   { font-family: 'Limelight', 'Cinzel', serif; letter-spacing: 10px; }
      .attrib { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 10px; }
    </style>
  </defs>

  <rect width="1100" height="1400" fill="#1A2238"/>

  <path d="M 110 90 L 490 90 L 520 110 L 550 90 L 580 110 L 610 90 L 990 90" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 1010 110 L 1010 670 L 990 690 L 1010 710 L 990 730 L 1010 750 L 1010 1290" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 990 1310 L 610 1310 L 580 1290 L 550 1310 L 520 1290 L 490 1310 L 110 1310" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 90 1290 L 90 750 L 110 730 L 90 710 L 110 690 L 90 670 L 90 110" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <g stroke="#F2E4C4" stroke-width="1.5" fill="none">
    <path d="M 110 90 L 110 60 L 70 60 L 70 110 L 90 110"/>
    <path d="M 990 90 L 990 60 L 1030 60 L 1030 110 L 1010 110"/>
    <path d="M 1010 1290 L 1030 1290 L 1030 1340 L 990 1340 L 990 1310"/>
    <path d="M 90 1290 L 70 1290 L 70 1340 L 110 1340 L 110 1310"/>
  </g>
  <rect x="115" y="115" width="870" height="1170" fill="none" stroke="#F2E4C4" stroke-width="0.8"/>

  <!-- wine glass + bottle ornament -->
  <g transform="translate(550,240)" fill="none" stroke="#F2E4C4" stroke-width="1.6">
    <path d="M -55 -25 Q -55 5 -38 14 L -38 32 L -50 32 L -26 32"/>
    <path d="M 34 -35 L 34 -15 L 26 -5 L 26 32 L 58 32 L 58 -5 L 50 -15 L 50 -35 Z"/>
    <line x1="34" y1="-35" x2="50" y2="-35" stroke-width="3"/>
  </g>

  <!-- quote -->
  <text x="550" y="410" text-anchor="middle" class="quote" font-size="64" fill="#F2E4C4">"If anyone orders Merlot,</text>
  <text x="550" y="485" text-anchor="middle" class="quote" font-size="64" fill="#F2E4C4">I'm leaving.</text>

  <line x1="380" y1="560" x2="720" y2="560" stroke="#F2E4C4" stroke-width="0.6"/>

  <text x="550" y="670" text-anchor="middle" class="quote" font-size="64" fill="#F2E4C4">I am NOT drinking</text>
  <text x="550" y="745" text-anchor="middle" class="quote" font-size="64" fill="#F2E4C4">any fucking</text>

  <!-- big MERLOT in Limelight -->
  <text x="550" y="940" text-anchor="middle" class="bang" font-size="168" fill="#F2E4C4">MERLOT."</text>

  <line x1="380" y1="1100" x2="720" y2="1100" stroke="#F2E4C4" stroke-width="0.6"/>
  <text x="550" y="1175" text-anchor="middle" class="attrib" font-size="24" fill="#F2E4C4">MILES RAYMOND</text>
  <text x="550" y="1220" text-anchor="middle" class="attrib" font-size="14" fill="#F2E4C4">SANTA YNEZ VALLEY · CALIFORNIA</text>
</svg>
