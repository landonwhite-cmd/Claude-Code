<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-label="Packaging insert card front">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Limelight&amp;family=Cinzel:wght@400;600;700&amp;family=Caveat:wght@400;500;600;700&amp;display=swap');
      .wordmark { font-family: 'Limelight', 'Cinzel', serif; letter-spacing: 10px; }
      .tagline  { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 8px; }
      .script   { font-family: 'Caveat', cursive; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="#1A2238"/>

  <!-- art deco border (4x6 portrait proportion) -->
  <path d="M 110 90 L 540 90 L 570 110 L 600 90 L 630 110 L 660 90 L 1090 90" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 1110 110 L 1110 870 L 1090 890 L 1110 910 L 1090 930 L 1110 950 L 1110 1690" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 1090 1710 L 660 1710 L 630 1690 L 600 1710 L 570 1690 L 540 1710 L 110 1710" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 90 1690 L 90 950 L 110 930 L 90 910 L 110 890 L 90 870 L 90 110" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <g stroke="#F2E4C4" stroke-width="1.5" fill="none">
    <path d="M 110 90 L 110 60 L 70 60 L 70 110 L 90 110"/>
    <path d="M 1090 90 L 1090 60 L 1130 60 L 1130 110 L 1110 110"/>
    <path d="M 1110 1690 L 1130 1690 L 1130 1740 L 1090 1740 L 1090 1710"/>
    <path d="M 90 1690 L 70 1690 L 70 1740 L 110 1740 L 110 1710"/>
  </g>
  <rect x="115" y="115" width="970" height="1570" fill="none" stroke="#F2E4C4" stroke-width="0.8"/>

  <!-- martini glass centerpiece -->
  <g transform="translate(600,700)" fill="none" stroke="#F2E4C4" stroke-width="3">
    <path d="M -110 -80 L 110 -80 L 0 55 Z"/>
    <line x1="0" y1="55" x2="0" y2="150"/>
    <line x1="-60" y1="150" x2="60" y2="150"/>
    <circle cx="38" cy="-30" r="10" fill="#F2E4C4"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="1060" text-anchor="middle" class="wordmark" font-size="56" fill="#F2E4C4">THE SCRIPTED</text>
  <text x="600" y="1140" text-anchor="middle" class="wordmark" font-size="56" fill="#F2E4C4">POUR</text>

  <line x1="380" y1="1200" x2="820" y2="1200" stroke="#F2E4C4" stroke-width="0.6"/>

  <!-- tagline in script -->
  <text x="600" y="1360" text-anchor="middle" class="script" font-size="86" fill="#F2E4C4">Where the movies</text>
  <text x="600" y="1450" text-anchor="middle" class="script" font-size="86" fill="#F2E4C4">meet the bar.</text>

  <line x1="380" y1="1560" x2="820" y2="1560" stroke="#F2E4C4" stroke-width="0.6"/>
  <text x="600" y="1620" text-anchor="middle" class="tagline" font-size="16" fill="#F2E4C4">EST. 2026 · MADE IN THE USA</text>
</svg>
