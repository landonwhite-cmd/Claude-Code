<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The Scripted Pour shop banner">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Limelight&amp;family=Cinzel:wght@400;600;700&amp;family=Caveat:wght@400;500;600;700&amp;display=swap');
      .wordmark { font-family: 'Limelight', 'Cinzel', serif; letter-spacing: 14px; }
      .tagline  { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 10px; }
      .script   { font-family: 'Caveat', cursive; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#1A2238"/>

  <!-- art deco border matched to banner proportion -->
  <path d="M 110 40 L 540 40 L 570 55 L 600 40 L 630 55 L 660 40 L 1090 40" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 1110 55 L 1110 120 L 1090 135 L 1110 150 L 1090 165 L 1110 180 L 1110 245" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 1090 260 L 660 260 L 630 245 L 600 260 L 570 245 L 540 260 L 110 260" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <path d="M 90 245 L 90 180 L 110 165 L 90 150 L 110 135 L 90 120 L 90 55" fill="none" stroke="#F2E4C4" stroke-width="1.5"/>
  <g stroke="#F2E4C4" stroke-width="1.5" fill="none">
    <path d="M 110 40 L 110 18 L 70 18 L 70 60 L 90 60"/>
    <path d="M 1090 40 L 1090 18 L 1130 18 L 1130 60 L 1110 60"/>
    <path d="M 1110 245 L 1130 245 L 1130 285 L 1090 285 L 1090 260"/>
    <path d="M 90 245 L 70 245 L 70 285 L 110 285 L 110 260"/>
  </g>
  <rect x="115" y="65" width="970" height="170" fill="none" stroke="#F2E4C4" stroke-width="0.6"/>

  <!-- left ornament: martini glass -->
  <g transform="translate(200,150)" fill="none" stroke="#F2E4C4" stroke-width="1.6">
    <path d="M -40 -28 L 40 -28 L 0 20 Z"/>
    <line x1="0" y1="20" x2="0" y2="50"/>
    <line x1="-22" y1="50" x2="22" y2="50"/>
    <circle cx="12" cy="-10" r="3" fill="#F2E4C4"/>
  </g>

  <!-- right ornament: martini glass (mirrored so it's symmetric) -->
  <g transform="translate(1000,150)" fill="none" stroke="#F2E4C4" stroke-width="1.6">
    <path d="M -40 -28 L 40 -28 L 0 20 Z"/>
    <line x1="0" y1="20" x2="0" y2="50"/>
    <line x1="-22" y1="50" x2="22" y2="50"/>
    <circle cx="-12" cy="-10" r="3" fill="#F2E4C4"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="150" text-anchor="middle" class="wordmark" font-size="44" fill="#F2E4C4">THE SCRIPTED POUR</text>

  <!-- tagline -->
  <line x1="410" y1="180" x2="790" y2="180" stroke="#F2E4C4" stroke-width="0.5"/>
  <text x="600" y="215" text-anchor="middle" class="tagline" font-size="14" fill="#F2E4C4">WHERE THE MOVIES MEET THE BAR</text>
</svg>
